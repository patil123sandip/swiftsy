<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Swiftsy Freight</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">S</div>
                <h5 style="margin:0; font-weight: 700;">Swiftsy IMS</h5>
            </div>
            <div class="sidebar-nav">
                <a href="/dashboard.html" class="nav-link premium active">
                    <i class="bi bi-grid"></i> Invoices
                </a>
                <a href="/customers.html" class="nav-link premium">
                    <i class="bi bi-people"></i> Customers
                </a>
            </div>
            <div style="padding: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05);">
                <button onclick="logout()" class="btn-outline-neon w-100"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 style="font-weight: 700; margin-bottom: 5px;">Invoices</h2>
                    <p style="color: var(--text-muted); margin: 0;">Manage your freight billing efficiently.</p>
                </div>
                <a href="/invoice.html" class="btn-neon"><i class="bi bi-plus-lg"></i> Create Invoice</a>
            </div>

            <!-- Stats Row -->
            <div class="row mb-5" id="statsRow" style="display:none;">
                <div class="col-md-4">
                    <div class="glass-panel p-4 d-flex align-items-center gap-3">
                        <div style="width:50px; height:50px; border-radius:12px; background: rgba(142,166,17,0.1); color:#8ea611; display:grid; place-items:center; font-size: 24px;">
                            <i class="bi bi-receipt"></i>
                        </div>
                        <div>
                            <p style="margin:0; color:var(--text-muted); font-size:14px;">Total Invoices</p>
                            <h3 style="margin:0; font-weight:700;" id="totalCount">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-4">
                <table class="table-premium" style="margin:0;">
                    <thead>
                        <tr>
                            <th>Invoice No</th>
                            <th>Date</th>
                            <th>Customer Name</th>
                            <th>BL/Container</th>
                            <th>Total (INR)</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTableBody">
                        <!-- Content -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
    <script>
        checkAuth();

        async function loadInvoices() {
            try {
                const res = await fetchWithAuth('/invoices');
                if (res && res.ok) {
                    const invoices = await res.json();
                    
                    document.getElementById('statsRow').style.display = 'flex';
                    document.getElementById('totalCount').innerText = invoices.length;

                    const tbody = document.getElementById('invoiceTableBody');
                    tbody.innerHTML = '';
                    
                    if(invoices.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No invoices found. Create one to get started.</td></tr>`;
                        return;
                    }

                    invoices.forEach(inv => {
                        tbody.innerHTML += `
                            <tr>
                                <td><span style="border: 1px solid rgba(142,166,17,0.3); padding: 4px 8px; border-radius: 6px; color:#8ea611; font-weight:500; font-size: 13px;">${inv.invoiceNumber}</span></td>
                                <td>${inv.date}</td>
                                <td><strong>${inv.customer.name}</strong></td>
                                <td><span style="color:var(--text-muted); font-size:13px;">BL: ${inv.blNumber}<br>CTN: ${inv.containerNumber}</span></td>
                                <td style="font-weight: 600;">₹${inv.grandTotal.toFixed(2)}</td>
                                <td class="text-end">
                                    <div class="d-flex gap-2 justify-content-end">
                                        <a href="/invoice.html?id=${inv.id}" class="btn btn-sm btn-outline-light" style="background: rgba(255,255,255,0.05); border:none;"><i class="bi bi-pencil"></i></a>
                                        <button onclick="downloadPdf(${inv.id}, '${inv.invoiceNumber}')" class="btn btn-sm" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6; border:none;"><i class="bi bi-file-earmark-pdf"></i></button>
                                        <button onclick="deleteInvoice(${inv.id})" class="btn btn-sm" style="background: rgba(220, 53, 69, 0.1); color: #ff6b6b; border:none;"><i class="bi bi-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (e) {
                console.error("Failed to load invoices", e);
            }
        }

        async function downloadPdf(id, invoiceNo) {
            const token = getToken();
            const res = await fetch(`/api/invoices/${id}/pdf`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `invoice_${invoiceNo}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
        }

        async function deleteInvoice(id) {
            if (confirm('Are you sure you want to delete this invoice?')) {
                const res = await fetchWithAuth(`/invoices/${id}`, { method: 'DELETE' });
                if (res.ok) loadInvoices();
            }
        }

        document.addEventListener('DOMContentLoaded', loadInvoices);
    </script>
</body>
</html>
