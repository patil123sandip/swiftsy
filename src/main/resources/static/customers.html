<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customers - Swiftsy Freight</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">S</div>
                <h5 style="margin:0; font-weight: 700;">Swiftsy IMS</h5>
            </div>
            <div class="sidebar-nav">
                <a href="/dashboard.html" class="nav-link premium">
                    <i class="bi bi-grid"></i> Invoices
                </a>
                <a href="/customers.html" class="nav-link premium active">
                    <i class="bi bi-people"></i> Customers
                </a>
            </div>
            <div style="padding: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05);">
                <button onclick="logout()" class="btn-outline-neon w-100"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 style="font-weight: 700; margin-bottom: 5px;">Customers</h2>
                    <p style="color: var(--text-muted); margin: 0;">Manage your client directory.</p>
                </div>
                <button class="btn-neon" data-bs-toggle="modal" data-bs-target="#customerModal"><i class="bi bi-plus-lg"></i> Add Customer</button>
            </div>

            <div class="glass-panel p-4">
                <table class="table-premium" style="margin:0;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Address</th>
                            <th>GST Number</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Premium -->
    <div class="modal fade" id="customerModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-panel" style="background: #1a1d24; border: 1px solid rgba(255,255,255,0.1);">
          <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.05);">
            <h5 class="modal-title" style="font-weight:600;">New Customer</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="customerForm">
                <div class="mb-4">
                    <label class="form-label">Company Name</label>
                    <input type="text" id="custName" class="form-control premium" required placeholder="e.g. Acme Corp">
                </div>
                <div class="mb-4">
                    <label class="form-label">Full Address</label>
                    <textarea id="custAddress" class="form-control premium" rows="3" required placeholder="Street, City, Zip"></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">GST Number</label>
                    <input type="text" id="custGst" class="form-control premium" required placeholder="27XXXXX0000X1Z5">
                </div>
            </form>
          </div>
          <div class="modal-footer" style="border-top: 1px solid rgba(255,255,255,0.05);">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" style="border-radius:8px;">Cancel</button>
            <button type="button" class="btn-neon" onclick="saveCustomer()">Save Customer</button>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
    <script>
        checkAuth();

        async function loadCustomers() {
            const res = await fetchWithAuth('/customers');
            if (res && res.ok) {
                const customers = await res.json();
                const tbody = document.getElementById('customerTableBody');
                tbody.innerHTML = '';
                
                if(customers.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4" style="color:var(--text-muted);">No customers found. Add one.</td></tr>`;
                    return;
                }

                customers.forEach(c => {
                    tbody.innerHTML += `
                        <tr>
                            <td><span style="color:#8ea611; font-weight:600;">#${c.id}</span></td>
                            <td style="font-weight: 500;">${c.name}</td>
                            <td style="color:var(--text-muted); font-size:14px;">${c.address}</td>
                            <td><span style="background:rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; font-size: 13px;">${c.gstNumber}</span></td>
                        </tr>
                    `;
                });
            }
        }

        async function saveCustomer() {
            const name = document.getElementById('custName').value;
            const address = document.getElementById('custAddress').value;
            const gstNumber = document.getElementById('custGst').value;

            const res = await fetchWithAuth('/customers', {
                method: 'POST',
                body: JSON.stringify({ name, address, gstNumber })
            });

            if (res && res.ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('customerModal'));
                modal.hide();
                document.getElementById('customerForm').reset();
                loadCustomers();
            }
        }

        document.addEventListener('DOMContentLoaded', loadCustomers);
    </script>
</body>
</html>
